# Minimal full-app image build for the Nemuri mobile-UI branch.
# Publishes to ghcr.io under the fork owner (no Depot; GitHub-hosted runner).
name: Build Nemuri Mobile UI Image

on:
  push:
    branches: ["nemuri-mobile-ui"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/relaxedentitydev/inbox-zero

jobs:
  build:
    name: Build and push
    # Native arm64 for the Mac mini deploy host; avoids QEMU.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:nemuri-mobile-ui
            ${{ env.IMAGE }}:nemuri-mobile-ui-${{ github.sha }}
          # Dockerfile.prod already embeds dummy build-time secrets.
          # GitHub Actions cache speeds rebuilds without needing Depot.
          cache-from: type=gha
          cache-to: type=gha,mode=max
